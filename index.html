    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "LOOKO Terminal",
            "url": "https://lookoutldz.top/",
            "description": "Looko 的个人导航主页，以复古终端形式展示项目与内容入口。",
            "inLanguage": "zh-CN"
          },
          {
            "@type": "Person",
            "name": "Looko",
            "url": "https://lookoutldz.top/",
            "jobTitle": "Backend Developer / Full Stack Developer",
            "sameAs": [
              "https://github.com/lookoutldz/",
              "https://juejin.cn/user/4341288062690398"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <main class="workspace">
      <section class="seo-summary" aria-label="网站摘要">
        <h1>LOOKO Terminal - Looko 的个人导航主页</h1>
        <p>
          LOOKO Terminal 是一个以复古终端为核心的个人导航主页，集中收录 Looko
          的项目、GitHub 与博客入口。
        </p>
        <nav aria-label="主要项目入口">
          <ul>
            <li><a href="https://moss.lookoutldz.top/">The Moss</a></li>
            <li><a href="https://arkvoice.top/">arkvoice</a></li>
            <li><a href="https://steamtower.top/">steamtower</a></li>
            <li><a href="https://github.com/lookoutldz/">GitHub</a></li>
            <li><a href="https://juejin.cn/user/4341288062690398">BLOG</a></li>
          </ul>
        </nav>
      </section>
      <section
        class="terminal-shell"
        aria-label="LOOKO Terminal"
      >
        <div class="terminal-frame">
          <header class="terminal-topbar">
            <div class="terminal-topbar__lights" aria-hidden="true">
              <span class="terminal-topbar__light terminal-topbar__light--red"></span>
              <span class="terminal-topbar__light terminal-topbar__light--yellow"></span>
              <span class="terminal-topbar__light terminal-topbar__light--green"></span>
            </div>
            <div class="terminal-topbar__title">LOOKO Terminal</div>
          </header>

          <div class="terminal-screen">
            <div class="terminal-noise" aria-hidden="true"></div>
            <div class="terminal-scanlines" aria-hidden="true"></div>

            <div class="terminal-viewport" id="terminalViewport">
              <div class="terminal-history" id="terminalHistory"></div>

              <form class="prompt-row" id="promptForm" autocomplete="off">
                <label class="prompt-label" for="terminalInput">
                  <span class="prompt-label__user">looko</span><span>@</span><span class="prompt-label__host">home</span><span>:~$</span>
                </label>
                <div class="prompt-field">
                  <input
                    id="terminalInput"
                    class="prompt-input"
                    type="text"
                    autocapitalize="off"
                    autocomplete="off"
                    autocorrect="off"
                    spellcheck="false"
                    aria-label="Terminal input"
                  />
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
