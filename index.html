  <head>

    />
    <meta
      name="keywords"
      content="LOOKO Terminal,Looko,个人主页,个人导航,开发者主页,终端风格网站,项目导航,独立开发,博客,GitHub"
    />

    <meta property="og:site_name" content="LOOKO Terminal" />
    <meta property="og:title" content="LOOKO Terminal | Looko 的个人导航主页" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LOOKO Terminal：琥珀色终端屏幕上的项目列表" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LOOKO Terminal | Looko 的个人导航主页" />
    <meta name="twitter:description" content="一个用复古终端体验呈现的个人导航主页。" />
    <meta name="twitter:image" content="https://lookoutldz.top/assets/og.png" />
    <link rel="canonical" href="https://lookoutldz.top/" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preload" href="/assets/fonts/ibm-plex-mono-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <!-- data-cfasync="false" keeps Cloudflare Rocket Loader from rewriting these; it breaks module scripts. -->
    <script src="/js/theme-init.js" data-cfasync="false"></script>
    <script type="module" src="/js/main.js" data-cfasync="false"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "LOOKO Terminal",
            "url": "https://lookoutldz.top/",
            "description": "Looko 的个人导航主页，以复古终端形式展示项目与内容入口。",
            "inLanguage": "zh-CN"
          },
          {
            "@type": "Person",
            "name": "Looko",
            "url": "https://lookoutldz.top/",
            "jobTitle": "Backend Developer / Full Stack Developer",
            "sameAs": [
              "https://github.com/lookoutldz/",
              "https://juejin.cn/user/4341288062690398"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div class="crt" lang="en">
      <main class="screen" id="screen">
        <h1 class="sr-only">LOOKO Terminal: Looko's personal navigation page</h1>

        <!-- Everything, including the project list, is printed by js/main.js from js/projects.js. -->
        <div class="output" id="output" role="log" aria-label="Terminal output">
          <noscript>
            <div class="line tone-bright">LOOKO OS 1.0 (tty1)</div>
            <div class="line">This terminal needs JavaScript to run.</div>
          </noscript>
        </div>

        <div class="prompt" id="prompt" hidden>
          <span class="ps1">looko@home:~$ </span><span class="typed" aria-hidden="true"><span id="typed-before"></span><span class="cursor" id="cursor"> </span><span id="typed-after"></span></span>
          <input
            class="input"
            id="input"
            type="text"
            aria-label="Terminal command"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
          />
        </div>
      </main>

      <footer class="status" aria-hidden="true">
        <span class="status-tty">LOOKO-TTY1</span>
        <span class="status-msg" id="status-msg"></span>
        <span class="status-hints">↑↓ history  Tab complete</span>
        <span class="status-clock" id="status-clock">--:--</span>
      </footer>
    </div>
  </body>
</html>
